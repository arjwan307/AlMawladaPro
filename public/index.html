<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المولدة برو</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>المولدة برو</h1><p>نسخة تأسيسية لإدارة المشتركين والفواتير والقبض</p></header><main><section><h2>إضافة مشترك</h2><form id="subscriber"><input name="name" placeholder="اسم المشترك" required><input name="phone" placeholder="الهاتف"><input name="amperes" type="number" min="0" step="0.5" placeholder="الأمبيرات"><button>حفظ المشترك</button></form></section><section><h2>المشتركون</h2><div id="subscribers"></div></section><section><h2>فاتورة جديدة</h2><form id="invoice"><select name="subscriberId" id="subscriberSelect" required></select><input name="month" type="month" required><input name="amount" type="number" min="0" step="0.01" placeholder="المبلغ" required><button>إصدار الفاتورة</button></form></section><section><h2>الفواتير والتحصيل</h2><div id="invoices"></div></section><p id="status" role="status"></p></main><script src="/app.js"></script></body></html>
