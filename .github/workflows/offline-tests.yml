name: AlMawladaPro Offline Tests
on:
  push:
    branches: [build/offline-commercial-v1]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check syntax
        run: |
          node --check AlMawladaPro/server.js
          node --check AlMawladaPro/public/app.js
      - name: Install runtime dependencies
        working-directory: AlMawladaPro
        run: npm install --omit=dev --no-audit --no-fund
      - name: Integration tests
        run: node --test AlMawladaPro/tests/*.test.cjs
