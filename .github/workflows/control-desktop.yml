name: Control center Mawlada desktop
on:
  push:
    branches: [feature/control-center-desktop-20261111]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs control-center/control-core.test.cjs
        working-directory: AlMawladaPro
  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
        working-directory: AlMawladaPro
      - run: node --test tests/*.test.cjs control-center/control-core.test.cjs
        working-directory: AlMawladaPro
      - run: npm run dist
        working-directory: AlMawladaPro
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Save installer and portable executable privately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="control-desktop-${GITHUB_SHA}"
          cat > "$RUNNER_TEMP/control-notes.txt" <<'NOTES'
          المولدة برو دسكتوب 0.2.0 مع ربط مركز الأرجوان. يشمل مثبتاً ونسخة محمولة. التعليمات في AlMawladaPro/control-center/README.ar.md.
          هذه مسودة خاصة للاختبار ولم تُنشر للجمهور.
          NOTES
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" --title "AlMawladaPro control center desktop preview" --notes-file "$RUNNER_TEMP/control-notes.txt"
          fi
          gh release upload "$tag" AlMawladaPro/dist/*.exe --clobber
