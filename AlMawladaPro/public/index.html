<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المولدة برو</title><link rel="stylesheet" href="style.css"></head><body><aside><h2>⚡ إدارة المولدة</h2><small>نظام إدارة الاشتراكات والجباية</small><nav id="nav"><button class="active" data-page="dashboard">⌂ لوحة التحكم</button><button data-page="subscribers">♟ المشتركون</button><button data-page="subscriptions">▤ الاشتراكات</button><button data-page="payments">▣ الجباية</button><button data-page="expenses">▣ المصروفات</button><button data-page="operations">⛽ الكاز والزيوت</button><button data-page="network">⚡ الخطوط والكابينات</button><button data-page="messages">✉ رسائل وواتساب</button><button data-page="reports">▥ التقارير</button><button data-page="settings">⚙ الإعدادات</button></nav><div class="price" id="sidebarPrice"></div></aside><main><header><div><h1 id="pageTitle">لوحة التحكم</h1><p>ملخص الاشتراكات والجباية الشهرية</p></div><div class="actions"><input type="month" id="month"><button id="paymentBtn">تسجيل دفعة</button><button id="demoBtn">+ مشتركون تجريبيون</button><button class="primary" id="addBtn">+ إضافة مشترك</button></div></header><section class="stats" id="stats"></section><section class="panel"><div class="panelhead"><h2 id="tableTitle">اشتراكات الشهر</h2><div class="filters"><input id="search" placeholder="ابحث بالاسم أو رقم الاشتراك"><select id="filter"><option value="all">الكل</option><option value="مسدد">مسدد</option><option value="جزئي">جزئي</option><option value="غير مسدد">غير مسدد</option><option value="غير مفوتر">غير مفوتر</option></select><button id="billBtn">إنشاء اشتراكات الشهر</button></div></div><div id="content"></div></section><section class="bottom"><div class="panel"><h2>الجباية خلال الشهر</h2><div id="chart" class="chart"></div></div><div class="panel"><h2>مصروفات الشهر</h2><div id="expenseSummary"></div><button id="expenseBtn">+ تسجيل مصروف</button></div></section><footer>المولدة برو — البيانات محفوظة محلياً على جهاز الخادم</footer></main><dialog id="modal"><form id="form"><h2 id="modalTitle"></h2><div id="fields"></div><menu><button type="button" id="cancel">إلغاء</button><button class="primary" type="submit">حفظ</button></menu></form></dialog><script src="app.js"></script></body></html>
